<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ee6309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular avatar icon -->
  <circle cx="70" cy="100" r="55" fill="url(#orangeGrad)" filter="url(#shadow)"/>

  <!-- Code bracket symbol -->
  <text x="70" y="112" font-family="Consolas, 'Courier New', monospace" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>

  <!-- KinnyCode brand text -->
  <text x="160" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="bold">
    <tspan fill="#ee6309">Kinny</tspan><tspan fill="#000000">Code</tspan>
  </text>

  <!-- Tagline -->
  <text x="160" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#666666">AI-Powered Code Editor</text>
</svg>