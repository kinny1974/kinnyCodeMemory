<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d45500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b84400;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ee6309" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="60" height="120"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="60" y="0" width="60" height="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0f172a" rx="12"/>

  <!-- Brain container group -->
  <g transform="translate(85, 100)" filter="url(#shadow)">
    
    <!-- Left half: Organic brain -->
    <g clip-path="url(#leftHalf)">
      <!-- Brain outline -->
      <ellipse cx="60" cy="60" rx="55" ry="50" fill="url(#orangeGrad)"/>
      
      <!-- Brain folds (organic) -->
      <path d="M15,40 Q25,35 35,45 Q45,35 55,42" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M10,55 Q20,50 30,58 Q40,48 50,55" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M12,70 Q22,65 32,72 Q42,62 52,68" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M15,85 Q25,80 35,88 Q45,78 55,82" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.4"/>
      
      <!-- Brain texture dots -->
      <circle cx="20" cy="45" r="2" fill="#ffffff" opacity="0.3"/>
      <circle cx="35" cy="50" r="1.5" fill="#ffffff" opacity="0.25"/>
      <circle cx="25" cy="65" r="2" fill="#ffffff" opacity="0.3"/>
      <circle cx="40" cy="70" r="1.5" fill="#ffffff" opacity="0.25"/>
      <circle cx="30" cy="80" r="2" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- Right half: Circuit board -->
    <g clip-path="url(#rightHalf)">
      <!-- Circuit base -->
      <ellipse cx="60" cy="60" rx="55" ry="50" fill="url(#circuitGrad)"/>
      
      <!-- Circuit traces -->
      <path d="M65,30 L65,45 L80,45 L80,55" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M75,25 L75,40 L90,40 L90,50 L100,50" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M85,35 L85,50 L95,50 L95,65" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      
      <!-- Horizontal traces -->
      <path d="M65,60 L80,60 L80,70 L95,70" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M70,75 L85,75 L85,85 L100,85" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M65,90 L80,90 L80,100 L95,100" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      
      <!-- Circuit nodes (solder points) -->
      <circle cx="65" cy="45" r="3" fill="#ffffff"/>
      <circle cx="80" cy="45" r="3" fill="#ffffff"/>
      <circle cx="80" cy="55" r="3" fill="#ffffff"/>
      <circle cx="75" cy="40" r="3" fill="#ffffff"/>
      <circle cx="90" cy="40" r="3" fill="#ffffff"/>
      <circle cx="90" cy="50" r="3" fill="#ffffff"/>
      <circle cx="100" cy="50" r="3" fill="#ffffff"/>
      <circle cx="85" cy="50" r="3" fill="#ffffff"/>
      <circle cx="95" cy="65" r="3" fill="#ffffff"/>
      <circle cx="80" cy="60" r="3" fill="#ffffff"/>
      <circle cx="80" cy="70" r="3" fill="#ffffff"/>
      <circle cx="95" cy="70" r="3" fill="#ffffff"/>
      <circle cx="70" cy="75" r="3" fill="#ffffff"/>
      <circle cx="85" cy="75" r="3" fill="#ffffff"/>
      <circle cx="85" cy="85" r="3" fill="#ffffff"/>
      <circle cx="100" cy="85" r="3" fill="#ffffff"/>
      <circle cx="65" cy="90" r="3" fill="#ffffff"/>
      <circle cx="80" cy="90" r="3" fill="#ffffff"/>
      <circle cx="80" cy="100" r="3" fill="#ffffff"/>
      <circle cx="95" cy="100" r="3" fill="#ffffff"/>
      
      <!-- IC chip symbol -->
      <rect x="72" y="55" width="16" height="12" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
      <line x1="72" y1="58" x2="68" y2="58" stroke="#ffffff" stroke-width="1"/>
      <line x1="72" y1="62" x2="68" y2="62" stroke="#ffffff" stroke-width="1"/>
      <line x1="72" y1="66" x2="68" y2="66" stroke="#ffffff" stroke-width="1"/>
      <line x1="88" y1="58" x2="92" y2="58" stroke="#ffffff" stroke-width="1"/>
      <line x1="88" y1="62" x2="92" y2="62" stroke="#ffffff" stroke-width="1"/>
      <line x1="88" y1="66" x2="92" y2="66" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Center dividing line (subtle) -->
    <line x1="60" y1="15" x2="60" y2="105" stroke="#0f172a" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- KinnyCode brand text -->
  <text x="170" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="bold">
    <tspan fill="#ee6309">Kinny</tspan><tspan fill="#ffffff">Code</tspan>
  </text>

  <!-- Memory subtitle -->
  <text x="170" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#ee6309">
    Memory
  </text>

  <!-- Tagline -->
  <text x="170" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94a3b8">
    Multilayer Memory System for AI
  </text>

  <!-- Decorative circuit traces on background -->
  <g opacity="0.15">
    <path d="M650,20 L680,20 L680,40 L700,40" stroke="#ee6309" stroke-width="2" fill="none"/>
    <path d="M660,50 L690,50 L690,70 L710,70" stroke="#ee6309" stroke-width="2" fill="none"/>
    <path d="M670,130 L700,130 L700,150 L720,150" stroke="#ee6309" stroke-width="2" fill="none"/>
    <path d="M680,160 L710,160 L710,180 L730,180" stroke="#ee6309" stroke-width="2" fill="none"/>
    <circle cx="680" cy="40" r="3" fill="#ee6309"/>
    <circle cx="700" cy="40" r="3" fill="#ee6309"/>
    <circle cx="690" cy="70" r="3" fill="#ee6309"/>
    <circle cx="710" cy="70" r="3" fill="#ee6309"/>
    <circle cx="700" cy="150" r="3" fill="#ee6309"/>
    <circle cx="720" cy="150" r="3" fill="#ee6309"/>
    <circle cx="710" cy="180" r="3" fill="#ee6309"/>
    <circle cx="730" cy="180" r="3" fill="#ee6309"/>
  </g>
</svg>
