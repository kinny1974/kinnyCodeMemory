<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d45500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b84400;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ee6309" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0f172a" rx="12"/>

  <!-- Circular brain/memory icon -->
  <circle cx="85" cy="100" r="60" fill="url(#brainGrad)" filter="url(#shadow)"/>
  
  <!-- Brain/network symbol inside circle -->
  <g transform="translate(85, 100)" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    
    <!-- Network nodes -->
    <circle cx="-25" cy="-20" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="25" cy="-20" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="-25" cy="20" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="25" cy="20" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-30" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="30" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="-30" cy="0" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="30" cy="0" r="4" fill="#ffffff" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-25" y2="-20" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="25" y2="-20" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-25" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="25" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="-30" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Inter-node connections -->
    <line x1="-25" y1="-20" x2="0" y2="-30" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="-20" x2="0" y2="-30" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="20" x2="0" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="20" x2="0" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- KinnyCode brand text -->
  <text x="170" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="bold">
    <tspan fill="#ee6309">Kinny</tspan><tspan fill="#ffffff">Code</tspan>
  </text>

  <!-- Memory subtitle -->
  <text x="170" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#ee6309">
    Memory
  </text>

  <!-- Tagline -->
  <text x="170" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94a3b8">
    Multilayer Memory System for AI
  </text>

  <!-- Decorative dots -->
  <circle cx="720" cy="30" r="3" fill="#ee6309" opacity="0.5"/>
  <circle cx="740" cy="50" r="2" fill="#ee6309" opacity="0.3"/>
  <circle cx="760" cy="35" r="4" fill="#ee6309" opacity="0.4"/>
  <circle cx="730" cy="170" r="3" fill="#ee6309" opacity="0.5"/>
  <circle cx="750" cy="150" r="2" fill="#ee6309" opacity="0.3"/>
  <circle cx="770" cy="165" r="4" fill="#ee6309" opacity="0.4"/>
</svg>
