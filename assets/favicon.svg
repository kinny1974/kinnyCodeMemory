<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d45500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b84400;stop-opacity:1" />
    </linearGradient>
    <clipPath id="leftHalf">
      <rect x="1" y="1" width="15" height="30"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="16" y="1" width="15" height="30"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0f172a"/>

  <!-- Brain container -->
  <g transform="translate(16, 16)">
    
    <!-- Left half: Organic brain -->
    <g clip-path="url(#leftHalf)">
      <ellipse cx="0" cy="0" rx="13" ry="12" fill="url(#orangeGrad)"/>
      <path d="M-11,-5 Q-7,-7 -3,-4 Q1,-8 5,-5" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7"/>
      <path d="M-12,0 Q-8,-2 -4,1 Q0,-3 4,0" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M-11,5 Q-7,3 -3,6 Q1,2 5,5" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5"/>
    </g>

    <!-- Right half: Circuit board -->
    <g clip-path="url(#rightHalf)">
      <ellipse cx="0" cy="0" rx="13" ry="12" fill="url(#circuitGrad)"/>
      <path d="M3,-8 L3,-4 L7,-4 L7,-1" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.8"/>
      <path d="M6,-10 L6,-6 L10,-6 L10,-3" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7"/>
      <path d="M3,0 L7,0 L7,3 L11,3" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.8"/>
      <path d="M3,5 L7,5 L7,8 L11,8" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7"/>
      <circle cx="3" cy="-4" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="-4" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="-1" r="1.5" fill="#ffffff"/>
      <circle cx="6" cy="-6" r="1.5" fill="#ffffff"/>
      <circle cx="10" cy="-6" r="1.5" fill="#ffffff"/>
      <circle cx="10" cy="-3" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="3" r="1.5" fill="#ffffff"/>
      <circle cx="11" cy="3" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="5" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="8" r="1.5" fill="#ffffff"/>
      <circle cx="11" cy="8" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Center dividing line -->
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#0f172a" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
