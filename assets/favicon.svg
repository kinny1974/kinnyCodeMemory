<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#orangeGrad)"/>

  <!-- Brain/network symbol -->
  <g transform="translate(16, 16)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    
    <!-- Network nodes -->
    <circle cx="-6" cy="-5" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="6" cy="-5" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="-6" cy="5" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="6" cy="5" r="2" fill="#ffffff" opacity="0.9"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-6" y2="-5" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="6" y2="-5" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="-6" y2="5" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="6" y2="5" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
