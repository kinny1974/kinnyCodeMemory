<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ee6309" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#orangeGrad)" filter="url(#shadow)"/>

  <!-- Brain/network symbol -->
  <g transform="translate(64, 64)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    
    <!-- Network nodes -->
    <circle cx="-18" cy="-14" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="18" cy="-14" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="-18" cy="14" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="18" cy="14" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-22" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="22" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="-22" cy="0" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="22" cy="0" r="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-18" y2="-14" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="18" y2="-14" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-18" y2="14" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="18" y2="14" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="22" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-22" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
