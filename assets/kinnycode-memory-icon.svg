<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee6309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d45500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d45500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b84400;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ee6309" flood-opacity="0.3"/>
    </filter>
    <clipPath id="leftHalf">
      <rect x="4" y="4" width="60" height="120"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="64" y="4" width="60" height="120"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="#0f172a" filter="url(#shadow)"/>

  <!-- Brain container -->
  <g transform="translate(64, 64)">
    
    <!-- Left half: Organic brain -->
    <g clip-path="url(#leftHalf)">
      <!-- Brain outline -->
      <ellipse cx="0" cy="0" rx="52" ry="48" fill="url(#orangeGrad)"/>
      
      <!-- Brain folds (organic) -->
      <path d="M-45,-20 Q-35,-25 -25,-18 Q-15,-28 -5,-22" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M-48,-5 Q-38,-10 -28,-3 Q-18,-13 -8,-7" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M-46,10 Q-36,5 -26,12 Q-16,2 -6,8" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M-44,25 Q-34,20 -24,27 Q-14,17 -4,22" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.4"/>
      
      <!-- Brain texture dots -->
      <circle cx="-38" cy="-15" r="2" fill="#ffffff" opacity="0.3"/>
      <circle cx="-25" cy="-10" r="1.5" fill="#ffffff" opacity="0.25"/>
      <circle cx="-35" cy="5" r="2" fill="#ffffff" opacity="0.3"/>
      <circle cx="-20" cy="10" r="1.5" fill="#ffffff" opacity="0.25"/>
      <circle cx="-30" cy="20" r="2" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- Right half: Circuit board -->
    <g clip-path="url(#rightHalf)">
      <!-- Circuit base -->
      <ellipse cx="0" cy="0" rx="52" ry="48" fill="url(#circuitGrad)"/>
      
      <!-- Circuit traces -->
      <path d="M8,-30 L8,-18 L22,-18 L22,-10" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M18,-35 L18,-22 L32,-22 L32,-14" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M28,-28 L28,-15 L38,-15 L38,-5" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      
      <!-- Horizontal traces -->
      <path d="M8,-5 L22,-5 L22,5 L38,5" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M12,15 L26,15 L26,25 L42,25" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M8,30 L22,30 L22,40 L38,40" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      
      <!-- Circuit nodes (solder points) -->
      <circle cx="8" cy="-18" r="3" fill="#ffffff"/>
      <circle cx="22" cy="-18" r="3" fill="#ffffff"/>
      <circle cx="22" cy="-10" r="3" fill="#ffffff"/>
      <circle cx="18" cy="-22" r="3" fill="#ffffff"/>
      <circle cx="32" cy="-22" r="3" fill="#ffffff"/>
      <circle cx="32" cy="-14" r="3" fill="#ffffff"/>
      <circle cx="28" cy="-15" r="3" fill="#ffffff"/>
      <circle cx="38" cy="-15" r="3" fill="#ffffff"/>
      <circle cx="38" cy="-5" r="3" fill="#ffffff"/>
      <circle cx="22" cy="-5" r="3" fill="#ffffff"/>
      <circle cx="22" cy="5" r="3" fill="#ffffff"/>
      <circle cx="38" cy="5" r="3" fill="#ffffff"/>
      <circle cx="12" cy="15" r="3" fill="#ffffff"/>
      <circle cx="26" cy="15" r="3" fill="#ffffff"/>
      <circle cx="26" cy="25" r="3" fill="#ffffff"/>
      <circle cx="42" cy="25" r="3" fill="#ffffff"/>
      <circle cx="8" cy="30" r="3" fill="#ffffff"/>
      <circle cx="22" cy="30" r="3" fill="#ffffff"/>
      <circle cx="22" cy="40" r="3" fill="#ffffff"/>
      <circle cx="38" cy="40" r="3" fill="#ffffff"/>
      
      <!-- IC chip symbol -->
      <rect x="14" cy="-2" width="14" height="10" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
      <line x1="14" y1="1" x2="10" y2="1" stroke="#ffffff" stroke-width="1"/>
      <line x1="14" y1="3" x2="10" y2="3" stroke="#ffffff" stroke-width="1"/>
      <line x1="14" y1="5" x2="10" y2="5" stroke="#ffffff" stroke-width="1"/>
      <line x1="28" y1="1" x2="32" y2="1" stroke="#ffffff" stroke-width="1"/>
      <line x1="28" y1="3" x2="32" y2="3" stroke="#ffffff" stroke-width="1"/>
      <line x1="28" y1="5" x2="32" y2="5" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Center dividing line (subtle) -->
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#0f172a" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
