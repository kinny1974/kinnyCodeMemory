<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinnyCode Memory - Búsqueda</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 15px 0; }
        header h1 { color: #38bdf8; font-size: 1.5rem; }
        nav { display: flex; gap: 20px; padding: 15px 0; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: all 0.2s; }
        nav a:hover, nav a.active { background: #334155; color: #38bdf8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { color: #f1f5f9; font-size: 1.2rem; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #94a3b8; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; color: #e2e8f0; font-size: 0.95rem;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .result-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .result-score { background: #1e40af; color: #93c5fd; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        .result-source { color: #94a3b8; font-size: 0.85rem; }
        .result-text { color: #e2e8f0; line-height: 1.6; white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 10px 20px; background: #334155; border: none; border-radius: 6px; color: #94a3b8; cursor: pointer; }
        .mode-btn.active { background: #38bdf8; color: #0f172a; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .rag-context { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 20px; white-space: pre-wrap; line-height: 1.6; }
        .copy-btn { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🧠 KinnyCode Memory</h1>
        </div>
    </header>
    
    <div class="container">
        <nav>
            <a href="/">Dashboard</a>
            <a href="/projects">Proyectos</a>
            <a href="/search" class="active">Búsqueda</a>
            <a href="/settings">Configuración</a>
        </nav>
        
        <!-- Search Mode Toggle -->
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('semantic')">🔍 Búsqueda Semántica</button>
            <button class="mode-btn" onclick="setMode('rag')">🤖 RAG Context</button>
        </div>
        
        <!-- Search Form -->
        <div class="card">
            <h2 id="search-title">Búsqueda Semántica</h2>
            <form id="search-form" onsubmit="performSearch(event)">
                <div class="form-group">
                    <label id="query-label">Consulta</label>
                    <input type="text" id="search-query" 
                           placeholder="¿Qué estás buscando?" required>
                </div>
                <div class="form-group">
                    <label>Proyecto</label>
                    <select id="search-project" required>
                        <option value="">Seleccionar proyecto...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Resultados (top_k)</label>
                    <select id="search-topk">
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
        </div>
        
        <!-- Results -->
        <div id="results-container">
            <div class="card">
                <p style="color: #94a3b8; text-align: center; padding: 40px;">
                    Escribe tu consulta y selecciona un proyecto para buscar
                </p>
            </div>
        </div>
    </div>
    
    <script>
        let currentMode = 'semantic';
        
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            const title = document.getElementById('search-title');
            const label = document.getElementById('query-label');
            const input = document.getElementById('search-query');
            
            if (mode === 'semantic') {
                title.textContent = 'Búsqueda Semántica';
                label.textContent = 'Consulta';
                input.placeholder = '¿Qué estás buscando?';
            } else {
                title.textContent = 'RAG Context';
                label.textContent = 'Pregunta';
                input.placeholder = '¿Qué quieres saber?';
            }
        }
        
        async function performSearch(e) {
            e.preventDefault();
            
            const query = document.getElementById('search-query').value;
            const projectId = document.getElementById('search-project').value;
            const topK = document.getElementById('search-topk').value;
            
            const container = document.getElementById('results-container');
            container.innerHTML = '<div class="card"><div class="loading">Buscando...</div></div>';
            
            try {
                const formData = new FormData();
                formData.append('query', query);
                formData.append('project_id', projectId);
                formData.append('top_k', topK);
                
                const endpoint = currentMode === 'semantic' ? '/api/search' : '/api/rag';
                const resp = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await resp.json();
                
                if (currentMode === 'semantic') {
                    renderSemanticResults(data.results || []);
                } else {
                    renderRAGResults(data.context || data);
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="card">
                        <p style="color: #f87171;">Error: ${err.message}</p>
                    </div>
                `;
            }
        }
        
        function renderSemanticResults(results) {
            const container = document.getElementById('results-container');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <p style="color: #94a3b8; text-align: center;">No se encontraron resultados</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = results.map((r, i) => `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-score">Score: ${r.score.toFixed(4)}</span>
                        <span class="result-source">${r.doc_type.toUpperCase()} — ${r.source_file.split('\\').pop().split('/').pop()}</span>
                    </div>
                    <div class="result-text">${escapeHtml(r.snippet)}</div>
                </div>
            `).join('');
        }
        
        function renderRAGResults(context) {
            const container = document.getElementById('results-container');
            
            container.innerHTML = `
                <div class="card" style="position: relative;">
                    <h2>Contexto RAG Generado</h2>
                    <button class="btn btn-secondary copy-btn" onclick="copyContext()">📋 Copiar</button>
                    <div class="rag-context" id="rag-context">${escapeHtml(context)}</div>
                </div>
            `;
        }
        
        function copyContext() {
            const context = document.getElementById('rag-context').textContent;
            navigator.clipboard.writeText(context);
            alert('Contexto copiado al portapapeles');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load projects
        fetch('/api/projects')
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById('search-project');
                (data.projects || []).forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    select.appendChild(opt);
                });
            });
    </script>
</body>
</html>
