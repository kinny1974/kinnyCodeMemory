<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinnyCode Memory - Configuración</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 15px 0; }
        header h1 { color: #38bdf8; font-size: 1.5rem; }
        nav { display: flex; gap: 20px; padding: 15px 0; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: all 0.2s; }
        nav a:hover, nav a.active { background: #334155; color: #38bdf8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { color: #f1f5f9; font-size: 1.2rem; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #94a3b8; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; color: #e2e8f0; font-size: 0.95rem;
        }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .info-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .info-label { color: #94a3b8; font-size: 0.85rem; }
        .info-value { color: #e2e8f0; font-size: 1.1rem; margin-top: 5px; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .status-ok { background: #064e3b; color: #34d399; }
        .status-error { background: #450a0a; color: #f87171; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🧠 KinnyCode Memory</h1>
        </div>
    </header>
    
    <div class="container">
        <nav>
            <a href="/">Dashboard</a>
            <a href="/projects">Proyectos</a>
            <a href="/search">Búsqueda</a>
            <a href="/settings" class="active">Configuración</a>
        </nav>
        
        <div class="grid">
            <!-- Server Info -->
            <div class="card">
                <h2>📊 Información del Servidor</h2>
                <div class="info-box">
                    <div class="info-label">Estado</div>
                    <div class="info-value" id="server-status">Verificando...</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Versión</div>
                    <div class="info-value" id="server-version">-</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Uptime</div>
                    <div class="info-value" id="server-uptime">-</div>
                </div>
                <div class="info-box">
                    <div class="info-label">URL</div>
                    <div class="info-value" id="server-url">-</div>
                </div>
            </div>
            
            <!-- Metrics -->
            <div class="card">
                <h2>📈 Métricas</h2>
                <div class="info-box">
                    <div class="info-label">Total Requests</div>
                    <div class="info-value" id="metric-requests">-</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Búsquedas</div>
                    <div class="info-value" id="metric-searches">-</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Índices</div>
                    <div class="info-value" id="metric-indexes">-</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Embeddings Cache Hit</div>
                    <div class="info-value" id="metric-cache">-</div>
                </div>
            </div>
        </div>
        
        <!-- API Endpoints -->
        <div class="card">
            <h2>🔌 API Endpoints</h2>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 1px solid #334155;">
                            <th style="text-align: left; padding: 10px; color: #94a3b8;">Método</th>
                            <th style="text-align: left; padding: 10px; color: #94a3b8;">Endpoint</th>
                            <th style="text-align: left; padding: 10px; color: #94a3b8;">Descripción</th>
                            <th style="text-align: left; padding: 10px; color: #94a3b8;">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="endpoints-table">
                        <tr><td colspan="4" style="padding: 20px; text-align: center; color: #94a3b8;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="card">
            <h2>⚡ Acciones Rápidas</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="openDocs()">📖 Abrir API Docs</button>
                <button class="btn btn-secondary" onclick="refreshMetrics()">🔄 Actualizar Métricas</button>
                <button class="btn btn-secondary" onclick="exportConfig()">💾 Exportar Config</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin.replace(':8080', ':8007');
        
        async function loadServerInfo() {
            try {
                const resp = await fetch(`${API_BASE}/health`);
                const data = await resp.json();
                
                document.getElementById('server-status').innerHTML = 
                    '<span class="status-badge status-ok">● En ejecución</span>';
                document.getElementById('server-version').textContent = data.version || '-';
                document.getElementById('server-uptime').textContent = data.uptime_human || '-';
                document.getElementById('server-url').textContent = API_BASE;
            } catch (err) {
                document.getElementById('server-status').innerHTML = 
                    '<span class="status-badge status-error">● Detenido</span>';
            }
        }
        
        async function loadMetrics() {
            try {
                const resp = await fetch(`${API_BASE}/metrics`);
                const data = await resp.json();
                
                document.getElementById('metric-requests').textContent = 
                    data.total_requests || 0;
                document.getElementById('metric-searches').textContent = 
                    data.searches || 0;
                document.getElementById('metric-indexes').textContent = 
                    data.indexes || 0;
                document.getElementById('metric-cache').textContent = 
                    data.cache_hits || 0;
            } catch (err) {
                console.error('Error loading metrics:', err);
            }
        }
        
        function loadEndpoints() {
            const endpoints = [
                { method: 'GET', path: '/health', desc: 'Health check', status: true },
                { method: 'GET', path: '/metrics', desc: 'Métricas del servidor', status: true },
                { method: 'POST', path: '/index-document', desc: 'Indexar documento', status: true },
                { method: 'POST', path: '/search-documents', desc: 'Búsqueda semántica', status: true },
                { method: 'POST', path: '/retrieve-context', desc: 'RAG context', status: true },
                { method: 'GET', path: '/list-documents', desc: 'Listar documentos', status: true },
                { method: 'POST', path: '/project-info', desc: 'Info del proyecto', status: true },
                { method: 'POST', path: '/save-conversation', desc: 'Guardar conversación', status: true },
                { method: 'POST', path: '/remember-decision', desc: 'Recordar decisión', status: true },
            ];
            
            const table = document.getElementById('endpoints-table');
            table.innerHTML = endpoints.map(e => `
                <tr style="border-bottom: 1px solid #1e293b;">
                    <td style="padding: 10px;">
                        <span style="background: ${e.method === 'GET' ? '#064e3b' : '#1e40af'}; 
                                     color: ${e.method === 'GET' ? '#34d399' : '#93c5fd'}; 
                                     padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">
                            ${e.method}
                        </span>
                    </td>
                    <td style="padding: 10px; font-family: monospace;">${e.path}</td>
                    <td style="padding: 10px; color: #94a3b8;">${e.desc}</td>
                    <td style="padding: 10px;">
                        <span class="status-badge status-ok">●</span>
                    </td>
                </tr>
            `).join('');
        }
        
        function openDocs() {
            window.open(`${API_BASE}/docs`, '_blank');
        }
        
        function refreshMetrics() {
            loadMetrics();
            loadServerInfo();
        }
        
        function exportConfig() {
            const config = {
                server_url: API_BASE,
                version: '1.0.0',
                exported: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kinnycodememory-config.json';
            a.click();
        }
        
        // Load data
        loadServerInfo();
        loadMetrics();
        loadEndpoints();
        
        // Auto-refresh
        setInterval(() => {
            loadMetrics();
            loadServerInfo();
        }, 30000);
    </script>
</body>
</html>
