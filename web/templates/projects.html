<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinnyCode Memory - Proyectos</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 15px 0; }
        header h1 { color: #38bdf8; font-size: 1.5rem; }
        nav { display: flex; gap: 20px; padding: 15px 0; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: all 0.2s; }
        nav a:hover, nav a.active { background: #334155; color: #38bdf8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { color: #f1f5f9; font-size: 1.2rem; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #94a3b8; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .project-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .project-info { flex: 1; }
        .project-name { font-size: 1.1rem; color: #f1f5f9; margin-bottom: 5px; }
        .project-meta { color: #94a3b8; font-size: 0.85rem; }
        .project-actions { display: flex; gap: 10px; }
        .upload-zone { border: 2px dashed #334155; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .upload-zone:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
        .upload-zone.dragover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .doc-list { max-height: 400px; overflow-y: auto; }
        .doc-item { padding: 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
        .doc-item:last-child { border-bottom: none; }
        .doc-name { color: #e2e8f0; }
        .doc-chunks { color: #94a3b8; font-size: 0.85rem; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #334155; border: none; border-radius: 6px; color: #94a3b8; cursor: pointer; }
        .tab.active { background: #38bdf8; color: #0f172a; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🧠 KinnyCode Memory</h1>
        </div>
    </header>
    
    <div class="container">
        <nav>
            <a href="/">Dashboard</a>
            <a href="/projects" class="active">Proyectos</a>
            <a href="/search">Búsqueda</a>
            <a href="/settings">Configuración</a>
        </nav>
        
        <!-- Create Project -->
        <div class="card">
            <h2>Crear Nuevo Proyecto</h2>
            <form id="create-project-form" onsubmit="createProject(event)">
                <div class="form-group">
                    <label>Nombre del Proyecto</label>
                    <input type="text" id="new-project-name" 
                           placeholder="mi-proyecto" required
                           pattern="[a-zA-Z0-9-_]+">
                    <small style="color: #64748b;">Solo letras, números, guiones y guiones bajos</small>
                </div>
                <button type="submit" class="btn btn-primary">Crear Proyecto</button>
            </form>
        </div>
        
        <!-- Projects List -->
        <div class="card">
            <h2>Proyectos Existentes</h2>
            <div id="projects-container">
                <p style="color: #94a3b8;">Cargando proyectos...</p>
            </div>
        </div>
        
        <!-- Project Details (hidden by default) -->
        <div id="project-details" class="hidden">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="detail-project-name">Detalles del Proyecto</h2>
                    <button class="btn btn-secondary" onclick="showList()">← Volver</button>
                </div>
                
                <div class="tab-container">
                    <button class="tab active" onclick="showTab('upload')">Subir Documentos</button>
                    <button class="tab" onclick="showTab('documents')">Documentos</button>
                </div>
                
                <!-- Upload Tab -->
                <div id="tab-upload">
                    <div class="upload-zone" id="upload-zone">
                        <p style="font-size: 1.2rem; margin-bottom: 10px;">📄 Arrastra archivos aquí</p>
                        <p style="color: #94a3b8;">o haz clic para seleccionar</p>
                        <input type="file" id="file-input" multiple hidden
                               accept=".pdf,.md,.txt,.epub,.doc,.docx,.odt,.ods,.csv,.xls,.xlsx">
                    </div>
                    <div id="upload-progress" style="margin-top: 15px;"></div>
                </div>
                
                <!-- Documents Tab -->
                <div id="tab-documents" class="hidden">
                    <div class="doc-list" id="doc-list">
                        <p style="color: #94a3b8;">Cargando documentos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentProject = null;
        
        async function loadProjects() {
            try {
                const resp = await fetch('/api/projects');
                const data = await resp.json();
                const projects = data.projects || [];
                
                const container = document.getElementById('projects-container');
                
                if (projects.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8;">No hay proyectos creados. Crea uno nuevo arriba.</p>';
                    return;
                }
                
                container.innerHTML = projects.map(p => `
                    <div class="project-card">
                        <div class="project-info">
                            <div class="project-name">${p}</div>
                            <div class="project-meta">Proyecto activo</div>
                        </div>
                        <div class="project-actions">
                            <button class="btn btn-primary" onclick="selectProject('${p}')">Abrir</button>
                            <button class="btn btn-danger" onclick="deleteProject('${p}')">Eliminar</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading projects:', err);
            }
        }
        
        async function createProject(e) {
            e.preventDefault();
            const name = document.getElementById('new-project-name').value;
            
            // Create project by indexing a dummy document
            // (project is created on first index)
            alert(`Proyecto "${name}" será creado cuando subas tu primer documento.`);
            document.getElementById('new-project-name').value = '';
        }
        
        async function selectProject(projectId) {
            currentProject = projectId;
            document.getElementById('detail-project-name').textContent = projectId;
            document.getElementById('projects-container').parentElement.classList.add('hidden');
            document.getElementById('project-details').classList.remove('hidden');
            
            await loadDocuments(projectId);
        }
        
        function showList() {
            document.getElementById('projects-container').parentElement.classList.remove('hidden');
            document.getElementById('project-details').classList.add('hidden');
            currentProject = null;
            loadProjects();
        }
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('tab-upload').classList.toggle('hidden', tab !== 'upload');
            document.getElementById('tab-documents').classList.toggle('hidden', tab !== 'documents');
        }
        
        async function loadDocuments(projectId) {
            try {
                const resp = await fetch(`/api/projects/${projectId}/documents`);
                const data = await resp.json();
                const docs = data.documents || [];
                
                const list = document.getElementById('doc-list');
                
                if (docs.length === 0) {
                    list.innerHTML = '<p style="color: #94a3b8; padding: 20px;">No hay documentos. Sube algunos archivos.</p>';
                    return;
                }
                
                list.innerHTML = docs.map(d => `
                    <div class="doc-item">
                        <div>
                            <div class="doc-name">${d.source_file.split('\\').pop().split('/').pop()}</div>
                            <div class="doc-chunks">${d.doc_type.toUpperCase()} — ${d.chunks} chunks</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading documents:', err);
            }
        }
        
        async function deleteProject(projectId) {
            if (!confirm(`¿Eliminar el proyecto "${projectId}" y todos sus documentos?`)) {
                return;
            }
            
            try {
                await fetch(`/api/projects/${projectId}`, { method: 'DELETE' });
                loadProjects();
            } catch (err) {
                alert('Error eliminando proyecto');
            }
        }
        
        // Upload handling
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        async function handleFiles(files) {
            if (!currentProject) {
                alert('Selecciona un proyecto primero');
                return;
            }
            
            const progress = document.getElementById('upload-progress');
            
            for (const file of files) {
                progress.innerHTML = `<p style="color: #38bdf8;">Subiendo ${file.name}...</p>`;
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('project_id', currentProject);
                
                try {
                    const resp = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await resp.json();
                    
                    if (result.status === 'success') {
                        progress.innerHTML = `<p style="color: #34d399;">✓ ${file.name} — ${result.chunks_indexed} chunks</p>`;
                    } else {
                        progress.innerHTML = `<p style="color: #f87171;">✗ ${file.name} — Error</p>`;
                    }
                } catch (err) {
                    progress.innerHTML = `<p style="color: #f87171;">✗ ${file.name} — Error de red</p>`;
                }
            }
            
            // Reload documents
            await loadDocuments(currentProject);
        }
        
        // Initial load
        loadProjects();
    </script>
</body>
</html>
