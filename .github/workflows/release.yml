name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executables
      run: |
        python build.py --all
    
    - name: Create ZIP
      run: |
        Compress-Archive -Path dist\* -DestinationPath KinnyCodeMemory-Windows-x64.zip
        Compress-Archive -Path memory_server.py,mcp_wrapper.py,cli.py,requirements.txt,.env.example,AGENTS.md -Update -DestinationPath KinnyCodeMemory-Windows-x64.zip
        if (Test-Path memory) { Compress-Archive -Path memory\* -Update -DestinationPath KinnyCodeMemory-Windows-x64.zip }
        if (Test-Path assets) { Compress-Archive -Path assets\* -Update -DestinationPath KinnyCodeMemory-Windows-x64.zip }
        if (Test-Path web) { Compress-Archive -Path web\* -Recurse -Update -DestinationPath KinnyCodeMemory-Windows-x64.zip }
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: KinnyCodeMemory-Windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install CPU-only torch (smaller binary)
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executables
      run: |
        python3 build.py --all
    
    - name: Make executables runnable
      run: |
        chmod +x dist/*
    
    - name: Create ZIP
      run: |
        cd dist && zip -r ../KinnyCodeMemory-Linux-x64.zip *
        cd .. && zip KinnyCodeMemory-Linux-x64.zip \
          memory_server.py \
          mcp_wrapper.py \
          cli.py \
          requirements.txt \
          .env.example \
          AGENTS.md
        if [ -d memory ]; then zip -r KinnyCodeMemory-Linux-x64.zip memory/; fi
        if [ -d assets ]; then zip -r KinnyCodeMemory-Linux-x64.zip assets/; fi
        if [ -d web ]; then zip -r KinnyCodeMemory-Linux-x64.zip web/; fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: KinnyCodeMemory-Linux-x64.zip

  build-source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create source archive
      run: |
        git archive --format=tar.gz --prefix=kinnyCodeMemory/ -o KinnyCodeMemory-Source.tar.gz HEAD
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: source-code
        path: KinnyCodeMemory-Source.tar.gz

  release:
    needs: [build-windows, build-linux, build-source]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Get version
      id: version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: KinnyCode Memory v${{ steps.version.outputs.VERSION }}
        body: |
          ## 🧠 KinnyCode Memory v${{ steps.version.outputs.VERSION }}
          
          ### 📦 Downloads
          
          | Platform | File | Description |
          |----------|------|-------------|
          | 🪟 Windows | `KinnyCodeMemory-Windows-x64.zip` | Standalone executables for Windows |
          | 🐧 Linux | `KinnyCodeMemory-Linux-x64.zip` | Standalone executables for Linux |
          | 📦 Source | `KinnyCodeMemory-Source.tar.gz` | Source code |
          
          ### 🚀 Quick Start
          
          **Windows:**
          ```bash
          # Extract and run
          .\KinnyCodeMemory-Server.exe
          ```
          
          **Linux:**
          ```bash
          # Extract and run
          chmod +x KinnyCodeMemory-Server
          ./KinnyCodeMemory-Server
          ```
          
          **From Source:**
          ```bash
          pip install -r requirements.txt
          python memory_server.py
          ```
          
          ### 📖 Documentation
          
          - [README](https://github.com/${{ github.repository }}#readme)
          - [API Documentation](http://localhost:8007/docs)
          - [Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          
          ### 🐛 Bug Reports
          
          Please [open an issue](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md) with details.
        files: |
          windows-build/KinnyCodeMemory-Windows-x64.zip
          linux-build/KinnyCodeMemory-Linux-x64.zip
          source-code/KinnyCodeMemory-Source.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
